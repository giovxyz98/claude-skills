<body class="font-sans text-testo antialiased">
<main class="max-w-3xl mx-auto px-4 py-8 sm:py-12">

<header class="relative mb-7 flex items-start justify-between gap-4">
  <svg class="absolute -top-6 right-0 w-64 sm:w-96 opacity-70 pointer-events-none" viewBox="0 0 400 130" aria-hidden="true">
    <defs>
      <radialGradient id="svCr" cx="222" cy="26" r="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
      <linearGradient id="svMt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a211b"/><stop offset="1" stop-color="#0d0b0a" stop-opacity="0"/></linearGradient>
    </defs>
    <circle cx="222" cy="26" r="70" fill="url(#svCr)"/>
    <path d="M0,130 L40,108 L90,92 L140,70 L180,46 L205,30 L222,24 L242,32 L268,56 L310,78 L360,100 L400,112 L400,130 Z" fill="url(#svMt)" stroke="#ff8a3d" stroke-opacity=".35" stroke-width="1"/>
  </svg>
  <div class="relative min-w-0">
    <p class="entra font-mono text-[0.7rem] tracking-[0.2em] text-brace" style="--i:0">37.50° N · 15.09° E</p>
    <h1 class="entra titolo font-serif text-4xl sm:text-6xl font-bold tracking-tight break-words mt-2" style="--i:1">Case a Catania</h1>
    <p class="entra text-tenue text-sm mt-3" style="--i:2">Annunci di affitto selezionati</p>
  </div>
  <button id="openSet" class="btn relative shrink-0 flex items-center gap-2" type="button" aria-label="Impostazioni">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span class="hidden sm:inline">Impostazioni</span>
  </button>
</header>

<details id="filtri" class="pannello mb-5">
  <summary><span>Filtri e ordinamento</span></summary>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 p-4 pt-1">
  <label class="text-xs font-medium text-tenue">Stato
    <select id="stato" class="fld mt-1"><option value="segnalato">Segnalati</option><option value="scartato">Scartati</option><option value="rimosso">Rimossi</option><option value="">Tutti</option></select></label>
  <label class="text-xs font-medium text-tenue">Visibilità
    <select id="vis" class="fld mt-1"><option value="visibili">Normali e preferiti</option><option value="preferito">Solo preferiti</option><option value="nascosto">Nascosti</option><option value="">Tutti</option></select></label>
  <label class="text-xs font-medium text-tenue">Portale
    <select id="portale" class="fld mt-1"><option value="">Tutti</option><option>idealista</option><option>immobiliare</option><option>subito</option><option>casa</option></select></label>
  <label class="text-xs font-medium text-tenue">Totale max (€)
    <input id="max" type="number" placeholder="600" class="fld mt-1"></label>
  <label class="text-xs font-medium text-tenue">Ordina per
    <select id="ord" class="fld mt-1"><option value="data_annuncio">Pubblicato</option><option value="prima_vista">Prima vista</option><option value="totale">Totale</option><option value="attivo_al">Attivo al</option><option value="data_stato">Data stato</option></select></label>
  <label class="text-xs font-medium text-tenue">Verso
    <select id="dir" class="fld mt-1"><option value="desc">Decrescente (più recente / più alto prima)</option><option value="asc">Crescente (meno recente / più basso prima)</option></select></label>
  <label class="text-xs font-medium text-tenue">Inserzionista
    <select id="tipo" class="fld mt-1"><option value="">Tutti</option><option value="privato">Privato</option><option value="agenzia">Agenzia</option></select></label>
  <label class="text-xs font-medium text-tenue">Posto auto
    <select id="auto" class="fld mt-1"><option value="">Indifferente</option><option value="si">Sì</option><option value="possibile">Possibile</option><option value="si,possibile">Sì o possibile</option><option value="no">No</option><option value="non indicato">Non indicato</option></select></label>
  <label class="text-xs font-medium text-tenue">Cerca
    <input id="q" placeholder="Via, zona, motivo…" class="fld mt-1"></label>
  <label class="col-span-2 sm:col-span-1 flex items-center gap-2 text-sm text-testo/80 cursor-pointer select-none">
    <input id="nobl" type="checkbox" class="w-5 h-5 accent-orange-400"> Senza condizioni bloccanti</label>
  <button id="go" class="btn btn-dark">Aggiorna</button>
  <button id="reset" class="btn" type="button">Azzera filtri</button>
  <button id="saveDef" class="btn" type="button" title="Questi filtri saranno quelli con cui si apre la pagina">Salva come predefiniti</button>
  <button id="delDef" class="btn" type="button" hidden>Rimuovi predefiniti</button>
  <details id="cbBox" class="col-span-2 sm:col-span-3 border-t border-white/10 pt-3">
    <summary class="cursor-pointer text-sm font-medium text-testo/80 select-none py-2 inline-block">Filtri avanzati <span id="cbCount" class="text-xs text-debole"></span></summary>
    <div class="mt-3 space-y-2">
      <div id="cb" class="space-y-2"></div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="cbAnd" class="btn" type="button">+ AND</button>
        <button id="cbOr" class="btn" type="button">+ OR</button>
        <button id="cbClear" class="btn" type="button">Svuota condizioni</button>
      </div>
      <p class="text-xs text-debole">AND e OR aggiungono una condizione. Le condizioni in AND vanno insieme; una riga rientrata (OR) è un&rsquo;alternativa al gruppo sopra: &ldquo;A AND B OR C&rdquo; = (A e B) oppure C.</p>
    </div>
  </details>
  </div>
</details>

<p id="info" class="font-mono text-xs text-tenue mb-4" role="status" aria-live="polite"></p>
<div id="out" class="space-y-4"></div>

</main>

<dialog id="dlg" class="dialogo w-[calc(100%-2rem)] max-w-lg rounded-2xl p-0 m-auto">
  <form method="dialog" id="setForm" class="flex flex-col max-h-[85dvh]">
    <div class="flex items-center justify-between px-5 py-4 border-b border-white/10">
      <h2 class="font-serif text-testo text-2xl">Impostazioni</h2>
      <button type="button" id="closeSet" class="text-tenue hover:text-testo text-3xl leading-none w-11 h-11 -mr-2" aria-label="Chiudi">&times;</button>
    </div>
    <div id="setBody" class="px-5 py-4 overflow-y-auto space-y-4 text-sm"></div>
    <div class="flex items-center justify-between gap-3 px-5 py-4 border-t border-white/10">
      <p id="setMsg" class="text-xs text-tenue min-w-0 break-words"></p>
      <div class="flex gap-2 shrink-0">
        <button type="button" id="cancelSet" class="btn">Annulla</button>
        <button type="button" id="saveSet" class="btn btn-dark">Salva</button>
      </div>
    </div>
  </form>
</dialog>

<script>
const URL_DB='https://yqhfbrefzkajmzgefztf.supabase.co/rest/v1/annunci_casa';
const KEY='sb_publishable_wLyt2bz9eqGqWzU0uJ_z6Q_vZd43CyT';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d=s=>s?s.split('-').reverse().join('/'):'';
let rows=[];

async function load(){
  const p=new URLSearchParams({select:'*',order:$('ord').value+'.'+$('dir').value+'.nullslast'});
  if($('tipo').value)p.append('tipo_inserzionista','eq.'+$('tipo').value);
  if($('auto').value){const vs=$('auto').value.split(','),cd=vs.map(v=>'posto_auto.eq."'+v+'"');if(vs.includes('non indicato'))cd.push('posto_auto.is.null');p.append('or','('+cd.join(',')+')')}
  if($('stato').value)p.append('stato','eq.'+$('stato').value);
  if($('portale').value)p.append('portale','eq.'+$('portale').value);
  if($('max').value)p.append('totale','lte.'+$('max').value);
  if($('nobl').checked)p.append('bloccante','eq.false');
  if($('vis').value==='visibili')p.append('preferenza','in.(normale,preferito)');
  else if($('vis').value)p.append('preferenza','eq.'+$('vis').value);
  $('info').textContent='Carico…';
  const r=await fetch(URL_DB+'?'+p,{headers:{apikey:KEY}});
  if(!r.ok){$('info').textContent='Errore '+r.status+': '+await r.text();return}
  rows=await r.json();
  show();
  $('out').classList.add('entrata');setTimeout(()=>$('out').classList.remove('entrata'),1400);
}

function f(n,v){return v===null||v===undefined||v===''?'':'<div class="row"><span class="font-mono text-[0.65rem] uppercase tracking-wider text-debole pt-1">'+n+'</span><span class="break-words text-sm text-testo/90">'+esc(v)+'</span></div>'}
function yn(v){return v===true?'sì':v===false?'no':null}
const badge=(t,c)=>'<span class="rounded-full px-2.5 py-0.5 text-xs font-medium '+c+'">'+t+'</span>';

/* ---- card compatta: fuori solo i campi che il prompt garantisce, il resto nell'accordion ---- */
const NUOVO_GIORNI=2; /* "nuovo" = prima vista negli ultimi N giorni (oggi compreso) */
const giorniFa=n=>{const t=new Date();t.setDate(t.getDate()-n);return t.toLocaleDateString('sv-SE')};
const vuoto=v=>v===null||v===undefined||v==='';
function fisso(label,val,mancante){
  const ok=!vuoto(val);
  return '<div class="min-w-0"><div class="font-mono text-[0.65rem] uppercase tracking-wider text-debole">'+label+'</div><div class="text-sm break-words '+(ok?'text-testo':'text-debole italic')+'">'+esc(ok?val:mancante)+'</div></div>';
}
const speseTxt=v=>vuoto(v)?'non indicate':Number(v)===0?'incluse':v+' €';
let aperti=new Set(); /* card con accordion aperto, per non richiuderle ad ogni aggiornamento */

function show(){
  scriviUrl();
  const q=$('q').value.trim().toLowerCase();
  let list=q?rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q)):rows;
  const gs=gruppiAttivi(),n=gs.reduce((t,g)=>t+g.length,0);
  if(n)list=list.filter(r=>gs.some(g=>g.every(c=>matchCond(r,c))));
  $('cbCount').textContent=n?'('+n+' attive)':'';
  $('info').textContent=list.length+(list.length===1?' annuncio':' annunci');
  const sogliaNuovo=giorniFa(NUOVO_GIORNI-1);
  $('out').innerHTML=list.map((r,i)=>{
    const tot=r.totale==null?'':r.totale+' €';
    const pref=r.preferenza==='preferito',nasc=r.preferenza==='nascosto';
    const nuovo=r.stato==='segnalato'&&r.prima_vista&&r.prima_vista>=sogliaNuovo;
    const stCol=r.stato==='segnalato'?'bg-emerald-400/10 text-emerald-300':'bg-white/5 text-tenue';
    const tipo=r.tipo_inserzionista==='agenzia'?'Agenzia':r.tipo_inserzionista==='privato'?'Privato':'';
    const oro=r.posto_auto==='si',ag=r.tipo_inserzionista==='agenzia',pr=r.tipo_inserzionista==='privato';
    const sfondo=oro?'tint-oro':ag?'tint-ag':pr?'tint-pr':'tint-no';
    const barra=ag?'border-left:4px solid #b9a7e8;':pr?'border-left:4px solid #5fb3c9;':'';
    return '<article class="card '+sfondo+' rounded-2xl p-4'+(nasc?' opacity-55':'')+'" style="--i:'+Math.min(i,12)+';'+barra+'">'+
      '<div class="flex items-start justify-between gap-4">'+
        '<h2 class="text-base font-semibold text-testo break-words min-w-0">'+(pref?'<span class="text-oro">&#9733;</span> ':'')+(vuoto(r.indirizzo)?'<span class="text-debole italic font-normal">via non indicata</span>':esc(r.indirizzo))+'</h2>'+
        (tot?'<div class="text-right shrink-0"><div class="font-serif text-testo text-[1.75rem] leading-none">'+esc(tot)+'</div><div class="font-mono text-[0.65rem] uppercase tracking-wider text-debole mt-1">al mese</div></div>':'')+
      '</div>'+
      '<div class="flex flex-wrap gap-1.5 mt-2 mb-3">'+
        (nuovo?badge('nuovo','bg-brace text-fondo'):'')+
        badge(esc(r.stato),stCol)+badge(esc(r.portale),'bg-white/5 text-tenue')+
        (tipo?badge(tipo.toLowerCase(),r.tipo_inserzionista==='agenzia'?'bg-violet-300/10 text-violet-300':'bg-sky-300/10 text-sky-300'):'')+
        (nasc?badge('nascosto','bg-white/5 text-tenue'):'')+
        (oro?badge('posto auto','bg-oro/15 text-oro'):'')+
        (r.bloccante?badge('bloccante','bg-red-400/10 text-red-300'):'')+
        (r.discordanza_zona?badge('zona discordante','bg-amber-300/10 text-amber-300'):'')+
      '</div>'+
      '<div class="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-2">'+
        fisso('Zona',r.zona,'non indicata')+
        fisso('Spese',vuoto(r.spese)?null:speseTxt(r.spese),'non indicate')+
        fisso('Cauzione',vuoto(r.cauzione)?null:r.cauzione+' €','non indicata')+
        fisso('Pubblicato',d(r.data_annuncio),'non indicata')+
        fisso('Posto auto',r.posto_auto,'non indicato')+
        fisso('Inserzionista',tipo?tipo+(r.inserzionista?': '+r.inserzionista:''):null,'non indicato')+
      '</div>'+
      '<details class="mt-3" data-id="'+r.id+'"'+(aperti.has(String(r.id))?' open':'')+'>'+
        '<summary class="cursor-pointer text-xs font-medium text-tenue select-none py-2 inline-block">Dettagli</summary>'+
        '<div class="mt-2">'+
        f('Titolo',r.titolo)+f('Quartiere',r.quartiere)+f('Zona portale',r.zona_portale)+f('Comune',r.comune)+
        f('Canone',r.canone)+f('Spese',r.spese)+f('Prezzo in lista',r.prezzo_vetrina)+
        f('Mq',r.mq)+f('Locali',r.locali)+f('Bagni',r.bagni)+f('Piano',r.piano)+f('Ascensore',yn(r.ascensore))+
        f('Arredato',yn(r.arredato))+f('Dotazioni',r.dotazioni)+
        f('Contratto',r.contratto)+f('Disponibilità',r.disponibilita)+f('Contatto',r.contatto)+
        f('Condizioni',r.condizioni)+f('Motivo',r.motivo)+f('Note',r.note)+
        f('Gruppo',r.gruppo)+f('ID precedenti',(r.id_precedenti||[]).join(', '))+
        f('Pubblicato il',d(r.pubblicato_il))+f('Aggiornato il',d(r.aggiornato_il))+
        f('Prima vista',d(r.prima_vista))+f('Attivo al',d(r.attivo_al))+f('Data stato',d(r.data_stato))+
        '</div>'+
      '</details>'+
      '<div class="flex flex-wrap items-center gap-2 mt-3">'+
        (r.url?'<a class="btn btn-dark" href="'+esc(r.url)+'" target="_blank" rel="noopener">Apri su '+esc(r.portale)+'</a>':'<span class="text-xs text-debole">'+esc(r.portale+' '+r.id_portale)+'</span>')+
        '<button class="btn" data-id="'+r.id+'" data-p="'+(pref?'normale':'preferito')+'">'+(pref?'Togli dai preferiti':'&#9733; Preferito')+'</button>'+
        '<button class="btn" data-id="'+r.id+'" data-p="'+(nasc?'normale':'nascosto')+'">'+(nasc?'Ripristina':'Nascondi')+'</button>'+
        (r.stato!=='rimosso'?'<button class="btn" data-id="'+r.id+'" data-rm="1" title="Segna come non più online">Non esiste più</button>':'')+
      '</div>'+
      '</article>';
  }).join('');
}
$('out').addEventListener('toggle',e=>{const id=e.target.dataset&&e.target.dataset.id;if(!id)return;e.target.open?aperti.add(id):aperti.delete(id)},true);

/* ---- filtri avanzati (condizioni combinabili, lato pagina sugli annunci caricati) ---- */
const CAMPI=[
  ['totale','Totale','n'],['canone','Canone','n'],['spese','Spese (0 = incluse)','n'],['cauzione','Cauzione','n'],['mq','Mq','n'],['locali','Locali','n'],['bagni','Bagni','n'],
  ['zona','Zona','t'],['quartiere','Quartiere','t'],['comune','Comune','t'],['piano','Piano','t'],['posto_auto','Posto auto','t'],['tipo_inserzionista','Privato/agenzia','t'],['inserzionista','Inserzionista (nome)','t'],['indirizzo','Indirizzo','t'],['portale','Portale','t'],
  ['contratto','Contratto','t'],['disponibilita','Disponibilità','t'],['dotazioni','Dotazioni','t'],['condizioni','Condizioni','t'],['note','Note','t'],['motivo','Motivo','t'],
  ['arredato','Arredato','b'],['ascensore','Ascensore','b'],['bloccante','Condizione bloccante','b'],['discordanza_zona','Zona discordante','b'],
  ['data_annuncio','Pubblicato','d'],['prima_vista','Prima vista','d'],['attivo_al','Attivo al','d']
];
const OPS={
  n:[['=','='],['!=','≠'],['>','>'],['>=','≥'],['<','<'],['<=','≤'],['vuoto','non indicato'],['pieno','indicato']],
  d:[['=','il'],['>=','dal'],['<=','fino al'],['vuoto','non indicata'],['pieno','indicata']],
  t:[['contiene','contiene'],['non contiene','non contiene'],['=','è'],['!=','non è'],['vuoto','non indicato'],['pieno','indicato']],
  b:[['=','è'],['vuoto','non indicato'],['pieno','indicato']]
};
let conds=[]; /* {con:'and'|'or',campo,op,val}: come in Bakeca, gli AND si legano prima, ogni OR apre un'alternativa */
const tipoCampo=k=>(CAMPI.find(c=>c[0]===k)||[,,'t'])[2];
const attiva=c=>c.op==='vuoto'||c.op==='pieno'||!vuoto(c.val);
function gruppiAttivi(){const gs=[];conds.forEach((c,i)=>{if(i===0||c.con==='or')gs.push([]);if(attiva(c))gs[gs.length-1].push(c)});return gs.filter(g=>g.length)}
function matchCond(r,c){
  const v=r[c.campo],t=tipoCampo(c.campo);
  if(c.op==='vuoto')return vuoto(v);
  if(c.op==='pieno')return !vuoto(v);
  if(vuoto(v))return c.op==='!='||c.op==='non contiene';
  if(t==='n'){const a=Number(v),b=Number(c.val);return c.op==='='?a===b:c.op==='!='?a!==b:c.op==='>'?a>b:c.op==='>='?a>=b:c.op==='<'?a<b:a<=b}
  if(t==='d'){const a=String(v),b=c.val;return c.op==='='?a===b:c.op==='>='?a>=b:a<=b}
  if(t==='b')return String(v)===(c.val==='si'?'true':'false');
  const a=String(v).toLowerCase(),b=String(c.val).toLowerCase();
  return c.op==='contiene'?a.includes(b):c.op==='non contiene'?!a.includes(b):c.op==='='?a===b:a!==b;
}
function renderCb(){
  let g=-1;
  $('cb').innerHTML=conds.map((c,i)=>{
    if(i===0||c.con==='or')g++;
    const t=tipoCampo(c.campo);
    const campi=CAMPI.map(x=>'<option value="'+x[0]+'"'+(x[0]===c.campo?' selected':'')+'>'+x[1]+'</option>').join('');
    const ops=OPS[t].map(x=>'<option value="'+x[0]+'"'+(x[0]===c.op?' selected':'')+'>'+x[1]+'</option>').join('');
    const senzaVal=c.op==='vuoto'||c.op==='pieno';
    const val=senzaVal?'':t==='b'
      ?'<select class="fld" data-f="val"><option value="si"'+(c.val==='si'?' selected':'')+'>sì</option><option value="no"'+(c.val==='no'?' selected':'')+'>no</option></select>'
      :'<input class="fld" data-f="val" type="'+(t==='n'?'number':t==='d'?'date':'text')+'" value="'+esc(c.val)+'" placeholder="valore">';
    const con=i===0?'<span class="text-xs text-debole pl-1">Dove</span>'
      :'<select class="fld font-semibold" data-f="con"><option value="and"'+(c.con==='and'?' selected':'')+'>AND</option><option value="or"'+(c.con==='or'?' selected':'')+'>OR</option></select>';
    return '<div class="grid grid-cols-2 sm:grid-cols-[4.5rem_1fr_9rem_1fr_auto] gap-2 items-center'+(g>0?' ml-5 pl-2 border-l-2 border-brace/50':'')+'" data-i="'+i+'">'+
      con+'<select class="fld" data-f="campo">'+campi+'</select><select class="fld" data-f="op">'+ops+'</select>'+
      (val||'<span class="hidden sm:block"></span>')+'<button class="btn" type="button" data-f="del" title="Rimuovi">&times;</button></div>';
  }).join('');
}
const aggiungiCond=con=>{conds.push({con:conds.length?con:'and',campo:'totale',op:'<=',val:''});renderCb()};
$('cbAnd').onclick=()=>aggiungiCond('and');
$('cbOr').onclick=()=>aggiungiCond('or');
$('cbClear').onclick=()=>{conds=[];renderCb();show()};
$('cb').addEventListener('input',e=>{const row=e.target.closest('[data-i]');if(!row||e.target.dataset.f!=='val')return;conds[row.dataset.i].val=e.target.value;show()});
$('cb').addEventListener('change',e=>{
  const row=e.target.closest('[data-i]');if(!row)return;
  const c=conds[row.dataset.i],f=e.target.dataset.f;
  if(f==='campo'){c.campo=e.target.value;c.op=OPS[tipoCampo(c.campo)][0][0];c.val=tipoCampo(c.campo)==='b'?'si':'';renderCb()}
  else if(f==='op'){c.op=e.target.value;renderCb()}
  else if(f==='con'){c.con=e.target.value;renderCb()}
  else if(f==='val'){c.val=e.target.value}
  show();
});
$('cb').addEventListener('click',e=>{const b=e.target.closest('[data-f="del"]');if(!b)return;conds.splice(b.closest('[data-i]').dataset.i,1);renderCb();show()});

/* ---- stato dei filtri <-> URL <-> filtri predefiniti (riga query_default in impostazioni) ---- */
const CTRL=['stato','vis','portale','max','ord','dir','tipo','auto','q'];
const BASE={stato:'segnalato',vis:'visibili',portale:'',max:'',ord:'data_annuncio',dir:'desc',auto:'',q:''};
let baseTipo='',queryDefault=''; /* baseTipo: 'privato' se le agenzie sono escluse dalle impostazioni */
const baseDi=id=>id==='tipo'?baseTipo:BASE[id];
function statoFiltri(){ /* solo i valori diversi dalla vista base */
  const p=new URLSearchParams();
  CTRL.forEach(id=>{if($(id).value!==baseDi(id))p.set(id,$(id).value)});
  if($('nobl').checked)p.set('nobl','1');
  const gs=gruppiAttivi();
  if(gs.length)p.set('cb',JSON.stringify(gs.flatMap((g,gi)=>g.map((c,i)=>[gi&&!i?'or':'and',c.campo,c.op,c.val]))));
  return p;
}
function applicaStato(p){ /* i parametri mancanti tornano alla vista base */
  CTRL.forEach(id=>{$(id).value=p.has(id)?p.get(id):baseDi(id)});
  $('nobl').checked=p.get('nobl')==='1';
  conds=[];
  try{JSON.parse(p.get('cb')||'[]').forEach(a=>{
    const [con,campo,op,val]=a;
    if(!CAMPI.some(x=>x[0]===campo)||!OPS[tipoCampo(campo)].some(x=>x[0]===op))return;
    conds.push({con:conds.length?(con==='or'?'or':'and'):'and',campo,op,val:val==null?'':String(val)});
  })}catch{}
  renderCb();
}
function scriviUrl(){try{const s=statoFiltri().toString();history.replaceState(null,'',location.pathname+(s?'?'+s:''))}catch{}}
function mostraDefault(){$('delDef').hidden=!queryDefault}
async function salvaDefault(){
  const v=statoFiltri().toString();
  if(!v){$('info').textContent='I filtri attuali coincidono con la vista base: niente da salvare.';return}
  const r=await fetch(URL_SET,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({chiave:'query_default',valore:v,descrizione:'Filtri con cui si apre la pagina (query string)',aggiornato_il:new Date().toISOString()})});
  if(!r.ok){$('info').textContent='Errore '+r.status+': '+await r.text();return}
  queryDefault=v;mostraDefault();$('info').textContent='Filtri predefiniti salvati: la pagina si aprirà con questi.';
}
async function rimuoviDefault(){
  const r=await fetch(URL_SET+'?chiave=eq.query_default',{method:'DELETE',headers:{apikey:KEY}});
  if(!r.ok){$('info').textContent='Errore '+r.status+': '+await r.text();return}
  queryDefault='';mostraDefault();$('info').textContent='Filtri predefiniti rimossi: la pagina si aprirà con la vista base.';
}
$('saveDef').onclick=salvaDefault;
$('delDef').onclick=rimuoviDefault;


$('out').onclick=async e=>{
  const b=e.target.closest('button[data-id]');
  if(!b)return;
  const rm=!!b.dataset.rm;
  if(rm&&!confirm('Segnare questo annuncio come non più online?'))return;
  b.disabled=true;
  const oggi=new Date().toLocaleDateString('sv-SE');
  const body=rm?{stato:'rimosso',motivo:'non piu online',data_stato:oggi}:{preferenza:b.dataset.p};
  const r=await fetch(URL_DB+'?id=eq.'+b.dataset.id,{method:'PATCH',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
  if(!r.ok){$('info').textContent='Errore '+r.status+': '+await r.text();b.disabled=false;return}
  if(!(await r.json()).length){$('info').textContent='Nessuna riga aggiornata (permessi mancanti?)';b.disabled=false;return}
  const row=rows.find(x=>String(x.id)===b.dataset.id);
  if(rm){Object.assign(row,body);if($('stato').value&&$('stato').value!=='rimosso')rows=rows.filter(x=>x!==row)}
  else{
    row.preferenza=b.dataset.p;
    const v=$('vis').value;
    if(v==='visibili'?row.preferenza==='nascosto':(v&&row.preferenza!==v))rows=rows.filter(x=>x!==row);
  }
  show();
};

/* ---- impostazioni (modale) ---- */
const URL_SET='https://yqhfbrefzkajmzgefztf.supabase.co/rest/v1/impostazioni';
const SET_ORD=['agenzie_subito','budget_max','budget_quasi_max','mq_min','mq_quasi_min','disponibilita_max_giorni','disponibilita_quasi_max_giorni','freschezza_max_giorni','freschezza_quasi_max_giorni','ricontrollo_dopo_giorni','ricontrolli_max_per_giro'];
const SET_LBL={agenzie_subito:'Agenzie (tutti i portali)',budget_max:'Budget massimo (€/mese)',budget_quasi_max:'Budget: limite “quasi” (€)',mq_min:'Metratura minima (mq)',mq_quasi_min:'Metratura: minimo “quasi” (mq)',disponibilita_max_giorni:'Disponibile entro (giorni)',disponibilita_quasi_max_giorni:'Disponibilità: limite “quasi” (giorni)',freschezza_max_giorni:'Freschezza massima (giorni)',freschezza_quasi_max_giorni:'Freschezza: limite “quasi” (giorni)',ricontrollo_dopo_giorni:'Ricontrolla i segnalati dopo (giorni)',ricontrolli_max_per_giro:'Ricontrolli massimi per giro'};
const K_AGE2='agenzie_altri_portali'; /* il menu "Agenzie" imposta insieme agenzie_subito e questa */
let setRows=[];

async function openSet(){
  $('setMsg').textContent='';
  $('setBody').innerHTML='<p class="text-debole">Carico…</p>';
  $('dlg').showModal();
  const r=await fetch(URL_SET+'?select=chiave,valore,descrizione,aggiornato_il&order=chiave',{headers:{apikey:KEY}});
  if(!r.ok){$('setBody').innerHTML='<p class="text-red-300">Errore'+r.status+': '+esc(await r.text())+'</p>';return}
  setRows=await r.json();
  const idx=k=>{const i=SET_ORD.indexOf(k);return i<0?99:i};
  const isOn=k=>{const x=setRows.find(y=>y.chiave===k);return !!x&&/^(si|sì|yes|true|1)$/i.test(String(x.valore).trim())};
  const ed=setRows.filter(x=>x.chiave!=='ultimo_giro'&&x.chiave!=='query_default'&&x.chiave!==K_AGE2).sort((a,b)=>idx(a.chiave)-idx(b.chiave)||a.chiave.localeCompare(b.chiave));
  const ug=setRows.find(x=>x.chiave==='ultimo_giro');
  $('setBody').innerHTML=ed.map(x=>{
    const lbl=esc(SET_LBL[x.chiave]||x.chiave);
    const hint=x.descrizione?'<span class="block text-xs text-debole mt-0.5">'+esc(x.descrizione)+'</span>':'';
    let inp;
    if(x.chiave==='agenzie_subito'){
      const on=isOn('agenzie_subito')&&isOn(K_AGE2);
      inp='<select class="fld mt-1.5" data-k="'+esc(x.chiave)+'" data-orig="'+(on?'si':'no')+'"><option value="no"'+(on?'':' selected')+'>No, escludile</option><option value="si"'+(on?' selected':'')+'>Sì, valutale</option></select>';
    }else if(SET_ORD.includes(x.chiave)){
      inp='<input type="number" min="0" step="1" class="fld mt-1.5" data-k="'+esc(x.chiave)+'" data-orig="'+esc(x.valore)+'" value="'+esc(x.valore)+'">';
    }else{
      inp='<input type="text" class="fld mt-1.5" data-k="'+esc(x.chiave)+'" data-orig="'+esc(x.valore)+'" value="'+esc(x.valore)+'">';
    }
    return '<label class="block font-medium text-testo/90">'+lbl+hint+inp+'</label>';
  }).join('')+(ug?'<p class="text-xs text-debole pt-2 border-t border-white/10">Ultimo giro del task: '+esc(ug.valore)+' — '+esc(ug.descrizione||'')+'</p>':'');
}

async function saveSet(){
  const inputs=[...$('setBody').querySelectorAll('[data-k]')];
  const changed=inputs.filter(i=>i.value.trim()!==i.dataset.orig);
  if(!changed.length){$('setMsg').textContent='Nessuna modifica.';return}
  for(const i of changed){
    if(i.type==='number'&&!/^\d+$/.test(i.value.trim())){$('setMsg').textContent='Valore non valido: '+(SET_LBL[i.dataset.k]||i.dataset.k);i.focus();return}
  }
  $('saveSet').disabled=true;$('setMsg').textContent='Salvo…';
  const now=new Date().toISOString();
  const scritture=[];
  changed.forEach(i=>{scritture.push(i);if(i.dataset.k==='agenzie_subito')scritture.push({value:i.value,dataset:{k:K_AGE2}})});
  const res=await Promise.all(scritture.map(i=>fetch(URL_SET+'?chiave=eq.'+encodeURIComponent(i.dataset.k),{method:'PATCH',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({valore:i.value.trim(),aggiornato_il:now})}).then(async r=>r.ok&&(await r.json()).length>0?null:(SET_LBL[i.dataset.k]||i.dataset.k)+(r.ok?' (nessuna riga aggiornata)':' (errore '+r.status+')')).catch(()=>SET_LBL[i.dataset.k]||i.dataset.k)));
  $('saveSet').disabled=false;
  const fail=res.filter(Boolean);
  if(fail.length){$('setMsg').textContent='Non salvato: '+fail.join(', ');return}
  $('dlg').close();
  const ag=changed.find(i=>i.dataset.k==='agenzie_subito');
  if(ag){const nuovo=ag.value.trim()==='si'?'':'privato';if($('tipo').value===baseTipo){baseTipo=nuovo;$('tipo').value=nuovo;load()}else baseTipo=nuovo}
  $('info').textContent='Impostazioni salvate ('+changed.length+'). Valgono dal prossimo giro del task.';
}
$('openSet').onclick=openSet;
$('closeSet').onclick=$('cancelSet').onclick=()=>$('dlg').close();
$('saveSet').onclick=saveSet;
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});

$('ord').addEventListener('change',()=>{$('dir').value=$('ord').value==='totale'?'asc':'desc'});
['stato','portale','ord','dir','tipo','auto','nobl','vis'].forEach(id=>$(id).onchange=load);
$('go').onclick=load;
$('reset').onclick=()=>{applicaStato(new URLSearchParams());load()};
$('max').onchange=load;
$('q').oninput=show;
async function init(){
  try{
    const r=await fetch(URL_SET+'?select=chiave,valore&chiave=in.(agenzie_subito,agenzie_altri_portali,query_default)',{headers:{apikey:KEY}});
    if(r.ok){
      const rs=await r.json(),v=k=>String((rs.find(x=>x.chiave===k)||{}).valore||'').trim();
      const on=k=>/^(si|sì|yes|true|1)$/i.test(v(k));
      baseTipo=on('agenzie_subito')||on('agenzie_altri_portali')?'':'privato';
      queryDefault=v('query_default');
    }
  }catch{}
  if(matchMedia('(min-width:640px)').matches)$('filtri').open=true;
  mostraDefault();
  applicaStato(location.search?new URLSearchParams(location.search):new URLSearchParams(queryDefault));
  load();
}
init();
