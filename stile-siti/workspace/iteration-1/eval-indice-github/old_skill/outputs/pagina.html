<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indice progetti GitHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--c:#22d3ee;--bg:#050b14}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at top,#0a1a2c 0%,var(--bg) 60%) fixed;font-family:'JetBrains Mono',monospace;color:#b6e9f3}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(34,211,238,.04) 0 1px,transparent 1px 3px);z-index:50}
.glow{text-shadow:0 0 12px rgba(34,211,238,.55)}
.card{border:1px solid rgba(34,211,238,.28);background:rgba(8,20,34,.7);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 0 24px rgba(34,211,238,.25)}
.cursor{display:inline-block;width:.6ch;background:var(--c);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body class="min-h-screen">
<main class="mx-auto max-w-5xl px-5 py-12 sm:py-20">
  <p class="text-xs text-cyan-500/80">giovanni@github:~$ ls progetti/</p>
  <h1 class="glow mt-3 text-3xl sm:text-5xl font-bold text-cyan-300 leading-tight break-words">Progetti personali<span class="cursor ml-1">&nbsp;</span></h1>
  <p class="mt-4 max-w-2xl text-sm text-cyan-100/70">Indice dei miei progetti su GitHub. Sostituisci i nomi e i link di esempio con i tuoi repository.</p>

  <div class="mt-8 flex flex-wrap gap-2 text-xs" id="filtri"></div>

  <section id="griglia" class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></section>

  <footer class="mt-14 border-t border-cyan-400/20 pt-4 text-xs text-cyan-500/70">~/progetti · <span id="n"></span> repository</footer>
</main>
<script>
// Modifica questo elenco con i tuoi repository reali.
const progetti=[
 {nome:"progetto-uno",desc:"Descrizione breve del primo progetto.",tag:"web",lang:"JavaScript",url:"https://github.com/tuo-utente/progetto-uno"},
 {nome:"progetto-due",desc:"Descrizione breve del secondo progetto.",tag:"strumenti",lang:"Python",url:"https://github.com/tuo-utente/progetto-due"},
 {nome:"progetto-tre",desc:"Descrizione breve del terzo progetto.",tag:"web",lang:"TypeScript",url:"https://github.com/tuo-utente/progetto-tre"},
 {nome:"progetto-quattro",desc:"Descrizione breve del quarto progetto.",tag:"ai",lang:"Python",url:"https://github.com/tuo-utente/progetto-quattro"},
 {nome:"progetto-cinque",desc:"Descrizione breve del quinto progetto.",tag:"strumenti",lang:"Shell",url:"https://github.com/tuo-utente/progetto-cinque"},
 {nome:"progetto-sei",desc:"Descrizione breve del sesto progetto.",tag:"ai",lang:"Python",url:"https://github.com/tuo-utente/progetto-sei"}
];
const g=document.getElementById('griglia'),f=document.getElementById('filtri');
document.getElementById('n').textContent=progetti.length;
function disegna(t){
 g.innerHTML=progetti.filter(p=>t==='tutti'||p.tag===t).map(p=>`
 <a href="${p.url}" target="_blank" rel="noopener" class="card block p-4 cursor-pointer">
  <div class="flex items-center justify-between text-[11px] text-cyan-500/80"><span>~/${p.tag}</span><span>${p.lang}</span></div>
  <h2 class="mt-3 text-lg font-bold text-cyan-300 break-words">${p.nome}</h2>
  <p class="mt-2 text-sm text-cyan-100/70">${p.desc}</p>
  <p class="mt-4 text-xs text-cyan-400">&gt; apri repository</p>
 </a>`).join('');
}
['tutti',...new Set(progetti.map(p=>p.tag))].forEach((t,i)=>{
 const b=document.createElement('button');b.textContent='['+t+']';
 b.className='px-3 py-1 border border-cyan-400/30 text-cyan-300 hover:border-cyan-300 hover:shadow-[0_0_12px_rgba(34,211,238,.3)] transition cursor-pointer';
 b.onclick=()=>{[...f.children].forEach(x=>x.classList.remove('bg-cyan-400/15'));b.classList.add('bg-cyan-400/15');disegna(t)};
 if(i===0)b.classList.add('bg-cyan-400/15');f.appendChild(b);
});
disegna('tutti');
</script>
</body>
</html>
