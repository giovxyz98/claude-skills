<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dieta settimanale</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<style>
  :root{--bg:#050b14;--panel:#08131f;--line:#134a5c;--cy:#22e5ff;--cy2:#7df3ff;--dim:#5f98a8;--warn:#ffb454;--ok:#4dffb0}
  html{scroll-behavior:smooth;color-scheme:dark}
  body{background:var(--bg);color:#c8f6ff;font-family:'JetBrains Mono',ui-monospace,monospace;min-height:100vh;
    background-image:radial-gradient(ellipse at 50% -10%,#0a2a3a 0%,transparent 60%);}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,rgba(34,229,255,.045) 0 1px,transparent 1px 3px);animation:flick 6s linear infinite}
  @keyframes flick{0%,100%{opacity:.8}50%{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  .cur{animation:blink 1s steps(1) infinite}
  .box{border:1px solid var(--line);background:linear-gradient(180deg,rgba(8,19,31,.9),rgba(5,11,20,.9));box-shadow:0 0 0 1px rgba(34,229,255,.04) inset,0 0 24px -10px rgba(34,229,255,.35)}
  .lbl{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  h1{font-size:clamp(1.6rem,6.5vw,3rem);line-height:1.05;font-weight:800;color:var(--cy2);text-shadow:0 0 18px rgba(34,229,255,.5)}
  .day{border:1px solid var(--line);padding:.55rem .2rem;cursor:pointer;user-select:none;transition:all .2s ease;background:transparent;color:var(--dim);font:inherit;text-align:center}
  .day:hover{border-color:var(--cy);color:var(--cy2);transform:translateY(-2px)}
  .day[aria-selected=true]{background:rgba(34,229,255,.12);border-color:var(--cy);color:var(--cy2);box-shadow:0 0 16px -2px rgba(34,229,255,.55)}
  .day small{display:block;font-size:.6rem;opacity:.8;margin-top:2px}
  .bar{height:10px;border:1px solid var(--line);background:#031018;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0aa7c2,var(--cy));box-shadow:0 0 12px var(--cy);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .bar.over>i{background:linear-gradient(90deg,#c27a0a,var(--warn));box-shadow:0 0 12px var(--warn)}
  input,select{background:#031018;border:1px solid var(--line);color:#c8f6ff;font:inherit;padding:.45rem .6rem;min-width:0;outline:none;transition:border-color .2s,box-shadow .2s}
  input:focus{border-color:var(--cy);box-shadow:0 0 10px -2px var(--cy)}
  input::placeholder{color:#3d6b79}
  .btn{border:1px solid var(--cy);color:var(--cy);background:transparent;padding:.45rem .8rem;cursor:pointer;font:inherit;transition:all .2s ease;user-select:none}
  .btn:hover{background:var(--cy);color:#001018;box-shadow:0 0 16px var(--cy)}
  .x{color:#3d6b79;cursor:pointer;background:none;border:0;font:inherit;padding:0 .4rem;transition:color .2s}
  .x:hover{color:#ff6b8a}
  .item{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:1px dashed #0e3544;animation:in .3s ease}
  @keyframes in{from{opacity:0;translate:-6px 0}}
  .item.done .nm{text-decoration:line-through;color:var(--dim)}
  input[type=checkbox]{appearance:none;width:1.05rem;height:1.05rem;border:1px solid var(--cy);padding:0;flex:none;cursor:pointer;display:grid;place-content:center}
  input[type=checkbox]:checked{background:var(--cy);box-shadow:0 0 10px var(--cy)}
  input[type=checkbox]:checked::after{content:"✓";color:#001018;font-size:.8rem;font-weight:800;line-height:1}
  .wk{display:grid;grid-template-columns:2.4rem 1fr 4.2rem;gap:.6rem;align-items:center;font-size:.8rem}
  .cup{width:1.6rem;height:1.9rem;border:1px solid var(--line);cursor:pointer;background:transparent;transition:all .2s;padding:0}
  .cup.on{background:linear-gradient(180deg,transparent 20%,var(--cy));border-color:var(--cy);box-shadow:0 0 10px -2px var(--cy)}
</style>
</head>
<body class="px-4 py-8">
<main class="mx-auto max-w-5xl">

  <header class="mb-6">
    <p class="lbl">~/salute/dieta <span class="cur">_</span></p>
    <h1 class="mt-2">Dieta<br>settimanale</h1>
    <p class="mt-3 text-sm" style="color:var(--dim)">$ traccia pasti, kcal e acqua. Salvato in locale nel browser.</p>
  </header>

  <nav class="grid grid-cols-7 gap-1.5 mb-6" id="days" role="tablist" aria-label="Giorni"></nav>

  <div class="grid gap-5 lg:grid-cols-[1.6fr_1fr]">
    <section class="box p-4 sm:p-5">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-3">
        <div>
          <p class="lbl" id="dname">Lunedì</p>
          <p class="text-3xl font-extrabold" style="color:var(--cy2)"><span id="kcal">0</span><span class="text-base font-light" style="color:var(--dim)"> / <span id="goalv">2000</span> kcal</span></p>
        </div>
        <label class="lbl flex items-center gap-2">obiettivo
          <input id="goal" type="number" min="800" max="6000" step="50" value="2000" class="w-24 text-right">
        </label>
      </div>
      <div class="bar mb-1" id="bar"><i></i></div>
      <p class="text-xs mb-5" id="rest" style="color:var(--dim)"></p>

      <div id="meals" class="space-y-5"></div>
    </section>

    <aside class="space-y-5">
      <section class="box p-4 sm:p-5">
        <p class="lbl mb-3">Acqua oggi</p>
        <div class="flex flex-wrap gap-1.5" id="cups"></div>
        <p class="text-xs mt-2" style="color:var(--dim)"><span id="wl">0</span> L su 2 L</p>
      </section>

      <section class="box p-4 sm:p-5">
        <p class="lbl mb-3">Riepilogo settimana</p>
        <div class="space-y-2" id="wk"></div>
        <div class="mt-4 pt-3 text-sm flex justify-between" style="border-top:1px dashed #0e3544">
          <span style="color:var(--dim)">media/giorno</span><b id="avg" style="color:var(--cy2)">0 kcal</b>
        </div>
        <button class="btn mt-4 w-full text-sm" id="reset">azzera settimana</button>
      </section>
    </aside>
  </div>
</main>

<script>
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MEALS=['Colazione','Spuntino','Pranzo','Merenda','Cena'];
const KEY='dieta-settimanale-v1';
const fresh=()=>({goal:2000,sel:(new Date().getDay()+6)%7,days:DAYS.map(()=>({water:0,items:[]}))});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.days||S.days.length!==7)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const eaten=d=>d.items.filter(i=>i.done).reduce((a,i)=>a+i.kcal,0);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const d=S.days[S.sel];
  $('days').innerHTML=DAYS.map((n,i)=>`<button class="day" role="tab" aria-selected="${i===S.sel}" data-d="${i}">${n.slice(0,3).toUpperCase()}<small>${eaten(S.days[i])}</small></button>`).join('');
  $('dname').textContent=DAYS[S.sel];
  const k=eaten(d);
  $('kcal').textContent=k;$('goalv').textContent=S.goal;$('goal').value=S.goal;
  const p=Math.min(100,k/S.goal*100);
  $('bar').className='bar mb-1'+(k>S.goal?' over':'');
  $('bar').firstElementChild.style.width=p+'%';
  $('rest').textContent=k>S.goal?`> superato di ${k-S.goal} kcal`:`> restano ${S.goal-k} kcal`;
  $('meals').innerHTML=MEALS.map((m,mi)=>{
    const its=d.items.map((it,ix)=>({it,ix})).filter(o=>o.it.meal===mi);
    const sub=its.filter(o=>o.it.done).reduce((a,o)=>a+o.it.kcal,0);
    return `<div>
      <div class="flex justify-between lbl mb-1" style="color:var(--cy)"><span>[ ${m} ]</span><span>${sub} kcal</span></div>
      ${its.map(o=>`<div class="item ${o.it.done?'done':''}"><input type="checkbox" data-t="${o.ix}" ${o.it.done?'checked':''} aria-label="mangiato"><span class="nm flex-1 text-sm break-words min-w-0">${esc(o.it.name)}</span><span class="text-xs" style="color:var(--dim)">${o.it.kcal}</span><button class="x" data-x="${o.ix}" aria-label="elimina">×</button></div>`).join('')||'<p class="text-xs py-1" style="color:#3d6b79">-- vuoto --</p>'}
      <form class="flex gap-2 mt-2" data-m="${mi}">
        <input name="n" placeholder="alimento" class="flex-1" required>
        <input name="k" type="number" min="0" placeholder="kcal" class="w-20" required>
        <button class="btn" aria-label="aggiungi">+</button>
      </form></div>`}).join('');
  $('cups').innerHTML=Array.from({length:8},(_,i)=>`<button class="cup ${i<d.water?'on':''}" data-c="${i+1}" aria-label="bicchiere ${i+1}"></button>`).join('');
  $('wl').textContent=(d.water*0.25).toFixed(2).replace(/\.?0+$/,'')||'0';
  const mx=Math.max(S.goal,...S.days.map(eaten));
  $('wk').innerHTML=S.days.map((x,i)=>{const e=eaten(x);return `<div class="wk"><span style="color:var(--dim)">${DAYS[i].slice(0,3).toUpperCase()}</span><div class="bar ${e>S.goal?'over':''}"><i style="width:${e/mx*100}%"></i></div><span class="text-right">${e}</span></div>`}).join('');
  const tot=S.days.reduce((a,x)=>a+eaten(x),0);
  $('avg').textContent=Math.round(tot/7)+' kcal';
  save();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-d],[data-x],[data-c]');if(!t)return;
  const d=S.days[S.sel];
  if(t.dataset.d!==undefined)S.sel=+t.dataset.d;
  else if(t.dataset.x!==undefined)d.items.splice(+t.dataset.x,1);
  else if(t.dataset.c!==undefined){const c=+t.dataset.c;d.water=d.water===c?c-1:c}
  render();
});
document.addEventListener('change',e=>{
  if(e.target.dataset.t!==undefined){S.days[S.sel].items[+e.target.dataset.t].done=e.target.checked;render()}
  if(e.target.id==='goal'){S.goal=Math.max(800,+e.target.value||2000);render()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;if(f.dataset.m===undefined)return;
  S.days[S.sel].items.push({meal:+f.dataset.m,name:f.n.value.trim(),kcal:Math.round(+f.k.value),done:false});
  render();
});
$('reset').onclick=()=>{if(confirm('Azzerare tutta la settimana?')){S=fresh();render()}};
render();
</script>
</body>
</html>
