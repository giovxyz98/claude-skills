<script>
const LIMIT_PAGINA = 20;

// Pagina servita da server.mjs (non apribile con file://): config e annunci vivono
// nel DB (SQL Server, vedi db.mjs), caricati via fetch su /api/config e
// /api/annunci?citta=...
let CONFIG = {};

let filtrati = [];

const paroleSelezionate = new Set();
// Categorie da NASCONDERE (in AND con tutti gli altri filtri, incluso paroleSelezionate):
// un annuncio sparisce se corrisponde ad ANCHE UNA SOLA delle etichette qui dentro.
const paroleEscludiSelezionate = new Set();
const serviziSelezionati = new Set();
// Filtro fisso da un link db.html (note_sviluppi.txt, "da implementare" punto 1):
// quando non vuoto, applicaFiltri ignora ricerca/parole/servizi/scartati e mostra SOLO
// questi telefoni — un click esplicito dal DB deve mostrare quel record a prescindere
// da cosa e' spuntato nel viewer (es. anche se scartato).
const telefoniForzati = new Set();
let searchDebounceTimer = null;
let soloNuovi = false;
let soloPreferiti = false;
let mostraScartati = false;

// Filtro avanzato (note_sviluppi.txt, accordion query builder): elenco di condizioni su un
// campo qualsiasi, ognuna con il proprio connettore AND/OR verso la precedente (la prima non ne
// ha). Precedenza classica: gli AND si legano prima, ogni OR apre un'alternativa — "A AND B OR C"
// = (A e B) oppure C (vedi alberoCondizioni). Va in AND con tutto il resto dei filtri, tranne quando e' attivo telefoniForzati
// (vedi costruisciAlberoFiltro). Stesso formato ad albero di admin/db.html
// (core_functions/query-annunci.mjs).
let filtroAvanzato = { condizioni: [] };

const CAMPI_QUERY = [
  { chiave: 'telefono', etichetta: 'Telefono', tipo: 'testo' },
  { chiave: 'zona', etichetta: 'Zona', tipo: 'testo' },
  { chiave: 'data', etichetta: 'Data (sito)', tipo: 'data' },
  { chiave: 'primaVista', etichetta: 'Prima pubblicazione', tipo: 'data' },
  { chiave: 'updated', etichetta: 'Aggiornato', tipo: 'data' },
  { chiave: 'preferito', etichetta: 'Preferito', tipo: 'bool' },
  { chiave: 'scartato', etichetta: 'Scartato', tipo: 'bool' },
  { chiave: 'nuovo', etichetta: 'Nuovo', tipo: 'bool' },
  { chiave: 'note', etichetta: 'Note', tipo: 'testo-lungo' },
  { chiave: 'servizi', etichetta: 'Servizi', tipo: 'lista' },
  { chiave: 'parole', etichetta: 'Parole chiave', tipo: 'lista' },
];
const OPERATORI_QUERY = {
  testo: [['contiene', 'contiene'], ['non_contiene', 'non contiene'], ['uguale', 'è uguale a'], ['inizia_con', 'inizia con'], ['vuoto', 'è vuoto'], ['non_vuoto', 'non è vuoto']],
  'testo-lungo': [['contiene', 'contiene'], ['non_contiene', 'non contiene'], ['vuoto', 'è vuoto'], ['non_vuoto', 'non è vuoto']],
  lista: [['contiene', 'contiene'], ['non_contiene', 'non contiene'], ['vuoto', 'è vuoto'], ['non_vuoto', 'non è vuoto']],
  bool: [['e', 'è']],
  data: [['uguale_giorno', 'il'], ['prima', 'prima di'], ['dopo', 'dopo di'], ['tra', 'tra']],
};
function operatoreDefaultQuery(tipo) { return OPERATORI_QUERY[tipo][0][0]; }

// Da elenco con connettori ad albero: gruppi separati dagli OR, dentro ogni gruppo gli AND.
function alberoCondizioni(condizioni, aNodo) {
  const gruppi = [];
  condizioni.forEach((c, i) => {
    if (i === 0 || c.connettore === 'or') gruppi.push([]);
    gruppi[gruppi.length - 1].push(aNodo(c));
  });
  const nodi = gruppi.map(g => (g.length === 1 ? g[0] : { tipo: 'gruppo', op: 'and', figli: g }));
  return nodi.length === 1 ? nodi[0] : { tipo: 'gruppo', op: 'or', figli: nodi };
}

// Indice di gruppo per ogni condizione (0 = primo gruppo, >0 = alternative in OR, rientrate).
function gruppiCondizioni(condizioni) {
  let g = -1;
  return condizioni.map((c, i) => {
    if (i === 0 || c.connettore === 'or') g++;
    return g;
  });
}

// URL salvati con il vecchio formato { op, condizioni } (un solo operatore per tutte).
function normalizzaFiltroAvanzato(f) {
  if (!f || !Array.isArray(f.condizioni)) return { condizioni: [] };
  return {
    condizioni: f.condizioni.map(c => ({ ...c, connettore: c.connettore || (f.op === 'or' ? 'or' : 'and') })),
  };
}

function condizioneAvanzataANodo(c) {
  const campo = CAMPI_QUERY.find(x => x.chiave === c.campo);
  const valore = campo.tipo === 'bool' ? c.valore === 'si' : c.valore;
  return { tipo: 'cond', campo: c.campo, operatore: c.operatore, valore, valore2: c.valore2 };
}

// Ordinamento esplicito (note_sviluppi.txt, punto 4): persistito in localStorage
// (coerente con come sono già gestite altre preferenze locali leggere in questo
// progetto), resta tra sessioni invece di resettarsi ad ogni apertura.
// "updated" e' il momento in cui lo scraper ha toccato la riga, NON la data dell'annuncio: con
// due fonti processate in sequenza (bakeca poi escort.it) un annuncio del 28 poteva finire
// sopra uno del 29 solo perche' elaborato dopo. "Più recenti/vecchi prima" ordina quindi per
// la data mostrata sulla card (giorno, formato canonico "DD mese YYYY", vedi
// core_functions/date-annuncio.mjs) e usa "updated" solo a parità di giorno o se la data non
// e' interpretabile.
const MESI_IT = { gennaio: 0, febbraio: 1, marzo: 2, aprile: 3, maggio: 4, giugno: 5, luglio: 6, agosto: 7, settembre: 8, ottobre: 9, novembre: 10, dicembre: 11 };
function giornoAnnuncioMs(a) {
  const m = (a.data || '').trim().toLowerCase().match(/^(\d{1,2})\s+([a-zà-ù]+)\s+(\d{4})$/);
  if (!m || MESI_IT[m[2]] === undefined) return null;
  return Date.UTC(Number(m[3]), MESI_IT[m[2]], Number(m[1]));
}
function confrontaPerDataAnnuncio(a, b) {
  const ga = giornoAnnuncioMs(a);
  const gb = giornoAnnuncioMs(b);
  if (ga !== null && gb !== null && ga !== gb) return ga - gb;
  return new Date(a.updated) - new Date(b.updated);
}
const CRITERI_ORDINAMENTO = {
  updated_desc: (a, b) => confrontaPerDataAnnuncio(b, a),
  updated_asc: (a, b) => confrontaPerDataAnnuncio(a, b),
  primaVista_desc: (a, b) => new Date(b.primaVista) - new Date(a.primaVista),
  primaVista_asc: (a, b) => new Date(a.primaVista) - new Date(b.primaVista),
  immagini_desc: (a, b) => (b.immagini || []).length - (a.immagini || []).length,
};
let criterioOrdinamento = localStorage.getItem('ordinamentoViewer') || 'updated_desc';
if (!(criterioOrdinamento in CRITERI_ORDINAMENTO)) criterioOrdinamento = 'updated_desc';

// Bulk actions (note_sviluppi.txt, punto 5): checkbox sulle card nascoste di
// default, mostrate solo in "modalita' selezione" (bottone "Seleziona"). Nessun

// quindi non serve una cache separata in memoria — il toggle scrive sul DB (/api/preferiti,

// Migrazione una tantum (2/9/2026) di eventuali preferiti/scartati rimasti in
// localStorage da prima del DB: se presenti per questa citta' e non gia' migrati,
// li spinge sul server una sola volta e pulisce le vecchie chiavi.
async function migraLocalStorageSeServe(citta) {
  const chiaveFatto = `migrato_db_${citta}`;
  if (localStorage.getItem(chiaveFatto)) return;
  try {
    const vecchiPreferiti = JSON.parse(localStorage.getItem(`preferiti_${citta}`) || '[]');
    const vecchiScartati = JSON.parse(localStorage.getItem(`dislike_${citta}`) || '[]');
    for (const telefono of vecchiPreferiti) await impostaPreferitoServer(telefono, true);
    for (const telefono of vecchiScartati) await impostaScartatoServer(telefono, true);
    localStorage.removeItem(`preferiti_${citta}`);
    localStorage.removeItem(`dislike_${citta}`);
  } catch {
    // localStorage non disponibile o dati corrotti: niente da migrare
  }
  localStorage.setItem(chiaveFatto, '1');
}

// Modalina di conferma generica (niente confirm() nativo): risolve true/false in
// base al bottone premuto o a Esc/click fuori (= annulla, coerente col resto della
// pagina dove "fuori" chiude sempre senza applicare nulla).
function chiediConferma(messaggio) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'conferma-overlay';
    overlay.innerHTML = `
      <div class="conferma-box">
        <p>${escapeHtml(messaggio)}</p>
        <div class="conferma-azioni">
          <button type="button" class="conferma-annulla">Annulla</button>
          <button type="button" class="conferma-ok">Conferma</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const chiudi = (risultato) => {
      overlay.remove();
      document.removeEventListener('keydown', onKey);
      resolve(risultato);
    };
    const onKey = (e) => { if (e.key === 'Escape') chiudi(false); };
    overlay.querySelector('.conferma-annulla').addEventListener('click', () => chiudi(false));
    overlay.querySelector('.conferma-ok').addEventListener('click', () => chiudi(true));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) chiudi(false); });
    document.addEventListener('keydown', onKey);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formattaData(iso) {
  if (!iso) return '?';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString('it-IT', {
    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });
}

// Immagini già caricate almeno una volta in questa sessione della pagina: per queste
// si assegna src subito (il browser le serve dalla sua cache, niente coda/attesa).
// Solo le immagini mai viste vengono messe in coda, con un tetto di richieste
// contemporanee (le immagini sono locali/statiche, ma un tetto evita comunque di aprire
// centinaia di richieste insieme quando una card ha decine di foto).
const immaginiCaricate = new Set();
const codaImmagini = [];
let richiesteAttive = 0;
const MAX_RICHIESTE_PARALLELE = 6;

function accodaImmagine(imgEl, url) {
  if (immaginiCaricate.has(url)) {
    imgEl.src = url;
    return;
  }
  codaImmagini.push({ imgEl, url });
  processaCoda();
}

function processaCoda() {
  while (richiesteAttive < MAX_RICHIESTE_PARALLELE && codaImmagini.length > 0) {
    const { imgEl, url } = codaImmagini.shift();
    richiesteAttive++;
    const fine = () => {
      richiesteAttive--;
      immaginiCaricate.add(url);
      processaCoda();
    };
    imgEl.addEventListener('load', fine, { once: true });
    imgEl.addEventListener('error', fine, { once: true });
    imgEl.src = url;
  }
}

function nomeCitta(citta) {
  if (!citta) return null;
  return citta.charAt(0).toUpperCase() + citta.slice(1);
}

  }
  const ultimo = tuttiAnnunci[0].updated;
  // "di cui N nuovi, M aggiornati" (note_sviluppi.txt): dal run REALE piu' recente in
  // storico_run, non un ricalcolo ne' un valore fisso — assente se questa citta' non ha

  const dettaglioRun = ultimoRunCorrente

    : '';
  cont.textContent = `${nome} - ${tuttiAnnunci.length} annunci salvati${dettaglioRun} - ultimo aggiornamento: ${formattaData(ultimo)}`;
}

function renderDropdownFiltro(panelId, conteggioId, voci, selezionati) {
  const panel = document.getElementById(panelId);
  const conteggioEl = document.getElementById(conteggioId);
  if (voci.length === 0) {
    panel.innerHTML = '<div class="vuoto-panel">Nessuna voce disponibile.</div>';
  } else {
    panel.innerHTML = voci.map(v => `
      <label class="voce">
        <input type="checkbox" data-voce="${escapeHtml(v)}" ${selezionati.has(v) ? 'checked' : ''}>
        ${escapeHtml(v)}
      </label>
    `).join('');
    panel.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        const voce = cb.dataset.voce;
        if (cb.checked) selezionati.add(voce);
        else selezionati.delete(voce);
        conteggioEl.textContent = String(selezionati.size);
        conteggioEl.hidden = selezionati.size === 0;
        applicaFiltri();
      });
    });
  }
  conteggioEl.textContent = String(selezionati.size);
  conteggioEl.hidden = selezionati.size === 0;
}

// ---------- filtro avanzato (accordion, note_sviluppi.txt): stesso formato ad albero di
// admin/db.html, ma qui un solo livello (un gruppo, AND oppure OR) — sufficiente per l'OR
// "tra campi uguali o diversi" richiesto, senza la complessita' di gruppi annidati che
// nessuno dei due filtri rapidi esistenti (Filtri/Escludi/Servizi) richiede.

function inputValoreCondizioneAvanzata(campo, cond) {
  if (cond.operatore === 'vuoto' || cond.operatore === 'non_vuoto') return '';
  if (campo.tipo === 'bool') {
    return `<select class="cond-valore"><option value="si" ${cond.valore === 'si' ? 'selected' : ''}>Sì</option><option value="no" ${cond.valore !== 'si' ? 'selected' : ''}>No</option></select>`;
  }
  if (campo.tipo === 'data') {
    if (cond.operatore === 'tra') {
      return `<input type="date" class="cond-valore" value="${escapeHtml(cond.valore || '')}"><span>e</span><input type="date" class="cond-valore2" value="${escapeHtml(cond.valore2 || '')}">`;
    }
    return `<input type="date" class="cond-valore" value="${escapeHtml(cond.valore || '')}">`;
  }
  return `<input type="text" class="cond-valore" value="${escapeHtml(cond.valore || '')}" placeholder="valore">`;
}

function rigaCondizioneAvanzataHtml(cond, idx, gruppo) {
  const campo = CAMPI_QUERY.find(c => c.chiave === cond.campo) || CAMPI_QUERY[1];
  const opzCampi = CAMPI_QUERY.map(c => `<option value="${c.chiave}" ${c.chiave === cond.campo ? 'selected' : ''}>${escapeHtml(c.etichetta)}</option>`).join('');
  const opzOperatori = OPERATORI_QUERY[campo.tipo].map(([v, l]) => `<option value="${v}" ${v === cond.operatore ? 'selected' : ''}>${escapeHtml(l)}</option>`).join('');
  const connettore = idx === 0
    ? '<span class="cond-connettore-primo">Dove</span>'
    : `<select class="cond-connettore"><option value="and" ${cond.connettore !== 'or' ? 'selected' : ''}>AND</option><option value="or" ${cond.connettore === 'or' ? 'selected' : ''}>OR</option></select>`;
  return `
    <div class="riga-condizione${gruppo > 0 ? ' indentata' : ''}" data-idx="${idx}">
      ${connettore}
      <select class="cond-campo">${opzCampi}</select>
      <select class="cond-operatore">${opzOperatori}</select>
      ${inputValoreCondizioneAvanzata(campo, cond)}
      <button type="button" class="cond-rimuovi" title="Rimuovi condizione">Rimuovi</button>
    </div>`;
}

function aggiornaConteggioFiltroAvanzato() {
  const el = document.getElementById('filtroAvanzatoConteggio');
  el.textContent = String(filtroAvanzato.condizioni.length);
  el.hidden = filtroAvanzato.condizioni.length === 0;
}

function renderPannelloFiltroAvanzato() {
  const cont = document.getElementById('righeFiltroAvanzato');
  const gruppi = gruppiCondizioni(filtroAvanzato.condizioni);
  cont.innerHTML = filtroAvanzato.condizioni.map((c, i) => rigaCondizioneAvanzataHtml(c, i, gruppi[i])).join('')
    || '<div class="vuoto-panel">Nessuna condizione: clicca AND o OR per aggiungere la prima.</div>';

  cont.querySelectorAll('.riga-condizione').forEach(riga => {
    const idx = Number(riga.dataset.idx);
    riga.querySelector('.cond-campo').addEventListener('change', (e) => {
      const campo = CAMPI_QUERY.find(c => c.chiave === e.target.value);
      filtroAvanzato.condizioni[idx] = { campo: campo.chiave, operatore: operatoreDefaultQuery(campo.tipo), valore: '', connettore: filtroAvanzato.condizioni[idx].connettore };
      renderPannelloFiltroAvanzato();
    });
    const selConnettore = riga.querySelector('.cond-connettore');
    if (selConnettore) selConnettore.addEventListener('change', (e) => {
      filtroAvanzato.condizioni[idx].connettore = e.target.value;
      renderPannelloFiltroAvanzato(); // cambia il rientro delle righe
    });
    riga.querySelector('.cond-operatore').addEventListener('change', (e) => {
      filtroAvanzato.condizioni[idx].operatore = e.target.value;
      renderPannelloFiltroAvanzato(); // l'input valore cambia forma (es. "tra" richiede due date)
    });
    const inputValore = riga.querySelector('.cond-valore');
    if (inputValore) inputValore.addEventListener('input', (e) => { filtroAvanzato.condizioni[idx].valore = e.target.value; });
    const inputValore2 = riga.querySelector('.cond-valore2');
    if (inputValore2) inputValore2.addEventListener('input', (e) => { filtroAvanzato.condizioni[idx].valore2 = e.target.value; });
    riga.querySelector('.cond-rimuovi').addEventListener('click', () => { filtroAvanzato.condizioni.splice(idx, 1); renderPannelloFiltroAvanzato(); });
  });
  aggiornaConteggioFiltroAvanzato();
}

function aggiungiCondizioneAvanzata(connettore) {
  const campo = CAMPI_QUERY[1];
  filtroAvanzato.condizioni.push({ campo: campo.chiave, operatore: operatoreDefaultQuery(campo.tipo), valore: '', connettore });
  renderPannelloFiltroAvanzato();
}

document.getElementById('aggiungiOr').addEventListener('click', () => aggiungiCondizioneAvanzata('or'));

    if (c.operatore === 'tra') return !!c.valore && !!c.valore2;
    return c.valore !== '' && c.valore !== undefined && c.valore !== null;
  });
  applicaFiltri();
});
document.getElementById('azzeraFiltroAvanzato').addEventListener('click', () => {

function chiudiLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lightboxImg').src = '';
}

// "Nuovo" = non ancora visto (campo visto sul record, DB): il viewer marca visto=true quando la
// card entra nello schermo (vedi renderBatch/osservatoreVisti). Il vecchio criterio (finestra di
// giorni da primaVista + pidStorico.length) non teneva conto se l'utente l'avesse davvero guardato.
// Il server marca "visto" un annuncio non appena lo si guarda, e OGNI riquery (applicaFiltri:
// scarto, preferito, ricerca, filtri, ordinamento...) rilegge lo stato dal server, dove quegli
// annunci non sono più nuovi: senza una memoria locale il badge spariva da tutte le card alla
// prima azione e "Solo nuovi" si svuotava. nuoviInSessione ricorda quali annunci erano nuovi
// quando sono arrivati in questa visita: il badge (e il filtro "Solo nuovi", applicato qui
// in locale) resta fino al prossimo caricamento della pagina, quando il server dirà "visto".
const nuoviInSessione = new Set();
function registraNuovi(lista) {
  for (const item of lista) if (!item.visto) nuoviInSessione.add(item.telefono);
}
function eNuovo(item) {
  return !item.visto || nuoviInSessione.has(item.telefono);
}

function renderBatch(nuovi) {
  const app = document.getElementById('app');
  nuovi.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const badgeVere = Object.entries(item.paroleChiave || {}).filter(([, v]) => v).map(([k]) => k);
    const servizi = item.servizi || [];
    const telefonoHtml = item.link
      ? `<a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.telefono)}</a>`
      : escapeHtml(item.telefono);
    const eFavorito = !!item.preferito;
    const eScartato = !!item.scartato;
    card.innerHTML = `
      <div class="card-header">
        <input type="checkbox" class="select-checkbox" aria-label="Seleziona" data-telefono="${escapeHtml(item.telefono)}" ${telefoniSelezionati.has(item.telefono) ? 'checked' : ''}>
        <h3>${telefonoHtml}</h3>
        <span class="meta">${escapeHtml(item.data || '?')} · ${escapeHtml(item.zona || 'zona non specificata')}</span>
        ${eNuovo(item) ? '<span class="badge-nuovo">NUOVO</span>' : ''}
        <button type="button" class="cuore-btn${eFavorito ? ' attivo' : ''}" aria-label="Preferito" data-telefono="${escapeHtml(item.telefono)}">${eFavorito ? '&#9829;' : '&#9825;'}</button>
        <button type="button" class="dislike-btn${eScartato ? ' attivo' : ''}" aria-label="Scarta" data-telefono="${escapeHtml(item.telefono)}">&#128078;</button>
        <span class="info-wrap">
          <button type="button" class="info-btn" aria-label="Date annuncio">i</button>
          <div class="info-popup" hidden>Creato il ${formattaData(item.primaVista)} - Aggiornato il: ${formattaData(item.updated)}</div>
        </span>
      </div>
      <div class="carosello"></div>
      ${badgeVere.length ? `<div class="badges">${badgeVere.map(k => `<span class="badge">${escapeHtml(k)}</span>`).join('')}</div>` : ''}
      ${servizi.length ? `<div class="badges">${servizi.map(s => `<span class="badge badge-servizio">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
      <div class="nota-wrap">
        <textarea class="nota-campo" placeholder="Note personali su questo annuncio..." data-telefono="${escapeHtml(item.telefono)}">${escapeHtml(item.note || '')}</textarea>
        <span class="nota-stato">Salvato</span>
      </div>
    `;

    const infoBtn = card.querySelector('.info-btn');
    const infoPopup = card.querySelector('.info-popup');
    // mouseenter/mouseleave coprono l'hover desktop; il click serve al tap mobile
    // (che non genera hover) e mostra comunque il popup se non era gia' aperto.
    // La chiusura al click fuori e' gestita dal listener globale su document (sotto).
    infoBtn.addEventListener('mouseenter', () => { infoPopup.hidden = false; });
    infoBtn.addEventListener('mouseleave', () => { infoPopup.hidden = true; });
    infoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      infoPopup.hidden = false;
    });

    card.querySelector('.select-checkbox').addEventListener('change', (e) => {
      if (e.target.checked) telefoniSelezionati.add(item.telefono);
      else telefoniSelezionati.delete(item.telefono);
      aggiornaBarraSelezione();
    });

    card.querySelector('.cuore-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      togglePreferito(item, e.currentTarget);
    });

    card.querySelector('.dislike-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDislike(item);
    });

    const notaCampo = card.querySelector('.nota-campo');
    const notaStato = card.querySelector('.nota-stato');
    notaCampo.addEventListener('input', () => {
      clearTimeout(debounceNote.get(item.telefono));
      debounceNote.set(item.telefono, setTimeout(() => {
        salvaNotaServer(item.telefono, notaCampo.value, notaStato);
      }, 800));
    });
    notaCampo.addEventListener('blur', () => {
      clearTimeout(debounceNote.get(item.telefono));
      salvaNotaServer(item.telefono, notaCampo.value, notaStato);
    });

    const carosello = card.querySelector('.carosello');
    const immagini = item.immagini || [];
    immagini.forEach((img, indice) => {
      const el = document.createElement('img');
      el.addEventListener('click', () => apriLightbox(immagini, indice));
      accodaImmagine(el, `/immagini/${img.file}`);
      carosello.appendChild(el);
    });

    app.appendChild(card);
  });

  // Marcati "visti" solo quando la card entra davvero nello schermo, non al semplice render:
  // altrimenti un blocco di 20 card disegnate ma mai scrollate sarebbe già "visto".
  nuovi.forEach((item, i) => {
    if (!item.visto) osservaVisibilita(app.children[app.children.length - nuovi.length + i], item);
  });
}

const cardInAttesa = new WeakMap();
const daSegnareVisti = new Set();
let timerVisti = null;
const osservatoreVisti = new IntersectionObserver((voci) => {
  for (const voce of voci) {
    if (!voce.isIntersecting) continue;
    osservatoreVisti.unobserve(voce.target);
    const item = cardInAttesa.get(voce.target);
    if (!item || item.visto) continue;
    item.visto = true; // eNuovo() resta true per questa visita grazie a nuoviInSessione
    daSegnareVisti.add(item.telefono);
  }
  if (daSegnareVisti.size > 0 && timerVisti === null) {
    timerVisti = setTimeout(() => {
      timerVisti = null;
      const telefoni = [...daSegnareVisti];
      daSegnareVisti.clear();
      segnaVistiServer(telefoni);
    }, 500);
  }
}, { threshold: 0.4 });
function osservaVisibilita(card, item) {
  if (!card) return;
  cardInAttesa.set(card, item);
  osservatoreVisti.observe(card);
}

// Il valore di verita' e' il server (annunci.preferito/scartato, vedi db.mjs): si attende la
// scrittura prima di ricalcolare i filtri, cosi' una card appena tolta dai preferiti/scartata
// non rischia di essere ancora inclusa (o esclusa) in base a un DB non ancora aggiornato —
// accettabile su un server locale (latenza trascurabile).
async function togglePreferito(item, btn) {
  const eraAttivo = !!item.preferito;
  if (eraAttivo) {
    const ok = await chiediConferma(`Rimuovere ${item.telefono} dai preferiti?`);
    if (!ok) return;
  }
  await impostaPreferitoServer(item.telefono, !eraAttivo);
  item.preferito = !eraAttivo;
  if (soloPreferiti && eraAttivo) {
    // il filtro "solo preferiti" e' attivo: la card appena rimossa non deve piu' comparire,
    // piu' semplice ricalcolare tutto invece di tenere sincronizzati filtrati/mostrati a mano
    applicaFiltri();
  } else {
    btn.classList.toggle('attivo', !eraAttivo);
    btn.innerHTML = eraAttivo ? '&#9825;' : '&#9829;';
  }
}

async function toggleDislike(item) {
  const eraAttivo = !!item.scartato;
  const messaggio = eraAttivo
    ? `Rimuovere ${item.telefono} dagli scartati?`
    : `Segnare ${item.telefono} come scartato? Non comparira' piu' nella lista principale (a meno di spuntare "Mostra scartati").`;
  const ok = await chiediConferma(messaggio);
  if (!ok) return;
  await impostaScartatoServer(item.telefono, !eraAttivo);
  item.scartato = !eraAttivo;
  // in entrambe le direzioni la visibilita' della card cambia (compare/scompare a
  // seconda di mostraScartati), quindi si ricalcola sempre invece di aggiornare l'icona sul posto
  applicaFiltri();
}

// Bulk actions (note_sviluppi.txt, punto 5): nessun endpoint nuovo, riuso di
// /api/preferiti e /api/scartati in Promise.all — per i numeri attesi da uno strumento
// personale (decine, forse un centinaio di selezioni) e' trascurabile per un server locale.
function aggiornaBarraSelezione() {
  const barra = document.getElementById('barraAzioniSelezione');
  const n = telefoniSelezionati.size;
  document.getElementById('conteggioSelezionati').textContent = n === 1 ? '1 selezionato' : `${n} selezionati`;
  barra.hidden = n === 0;
}

function pulisciSelezione() {
  telefoniSelezionati.clear();
  document.querySelectorAll('#app .select-checkbox').forEach(cb => { cb.checked = false; });
  aggiornaBarraSelezione();
}

function toggleModalitaSelezione() {
  modalitaSelezione = !modalitaSelezione;
  document.getElementById('app').classList.toggle('selezione-attiva', modalitaSelezione);
  document.getElementById('btnSeleziona').classList.toggle('attivo', modalitaSelezione);
  if (!modalitaSelezione) pulisciSelezione();
}

async function eseguiBulkPreferiti() {
  const telefoni = [...telefoniSelezionati];
  if (telefoni.length === 0) return;
  const ok = await chiediConferma(`Aggiungere ${telefoni.length} annunci ai preferiti?`);
  if (!ok) return;
  pulisciSelezione();
  await Promise.all(telefoni.map(t => impostaPreferitoServer(t, true)));
  applicaFiltri();
}

async function eseguiBulkScarta() {
  const telefoni = [...telefoniSelezionati];
  if (telefoni.length === 0) return;
  const ok = await chiediConferma(`Scartare ${telefoni.length} annunci? Non compariranno piu' nella lista principale (a meno di spuntare "Mostra scartati").`);
  if (!ok) return;
  pulisciSelezione();
  await Promise.all(telefoni.map(t => impostaScartatoServer(t, true)));
  applicaFiltri();
}

document.getElementById('btnSeleziona').addEventListener('click', toggleModalitaSelezione);
document.getElementById('btnAnnullaSelezione').addEventListener('click', pulisciSelezione);
document.getElementById('btnPreferitiSelezionati').addEventListener('click', eseguiBulkPreferiti);
document.getElementById('btnScartaSelezionati').addEventListener('click', eseguiBulkScarta);

// Costruzione dell'albero da mandare a /api/annunci (core_functions/query-annunci.mjs,
// note_sviluppi.txt): la valutazione vera vive lato server, qui si traduce solo lo stato
// dei filtri della pagina (ricerca/dropdown/checkbox/accordion avanzato) in un gruppo AND —
// stesso motore condiviso con admin/db.html.
function costruisciAlberoFiltro() {
  if (telefoniForzati.size > 0) {
    return { tipo: 'gruppo', op: 'or', figli: [...telefoniForzati].map(t => ({ tipo: 'cond', campo: 'telefono', operatore: 'uguale', valore: t })) };
  }
  const figli = [];
  const testo = document.getElementById('ricerca').value.trim();
  if (testo) figli.push({ tipo: 'cond', campo: 'ricercaTesto', operatore: 'contiene', valore: testo });
  paroleSelezionate.forEach(p => figli.push({ tipo: 'cond', campo: 'parole', operatore: 'uguale', valore: p }));
  if (paroleEscludiSelezionate.size > 0) {
    // Esclusione: se una qualunque etichetta selezionata e' vera per l'annuncio, sparisce
    // (a differenza delle "Filtri" sopra, qui basta UN match solo per escludere) — gruppo OR
    // negato: nessuna delle condizioni deve essere vera.
    figli.push({ tipo: 'gruppo', op: 'or', negato: true, figli: [...paroleEscludiSelezionate].map(p => ({ tipo: 'cond', campo: 'parole', operatore: 'uguale', valore: p })) });
  }
  serviziSelezionati.forEach(s => figli.push({ tipo: 'cond', campo: 'servizi', operatore: 'uguale', valore: s }));
  // "Solo nuovi" non va al server (vedi nuoviInSessione): lo applica applicaFiltri in locale.
  if (soloPreferiti) figli.push({ tipo: 'cond', campo: 'preferito', operatore: 'e', valore: true });
  // di default gli scartati sono nascosti da ovunque; con la checkbox attiva si vedono SOLO quelli
  figli.push({ tipo: 'cond', campo: 'scartato', operatore: 'e', valore: mostraScartati });
  if (filtroAvanzato.condizioni.length > 0) {
    figli.push(alberoCondizioni(filtroAvanzato.condizioni, condizioneAvanzataANodo));
  }
  return { tipo: 'gruppo', op: 'and', figli };
}

async function applicaFiltri() {
  const albero = costruisciAlberoFiltro();
  try {
    const res = await fetch(`/api/annunci?citta=${encodeURIComponent(cittaCorrente)}&filtro=${encodeURIComponent(JSON.stringify(albero))}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    filtrati = await res.json();
    registraNuovi(filtrati);
    if (soloNuovi) filtrati = filtrati.filter(eNuovo);
  } catch (err) {
    document.getElementById('app').innerHTML = `<div class="vuoto">Errore nel caricare gli annunci filtrati: ${escapeHtml(err.message)}</div>`;
    document.getElementById('caricaAltri').style.display = 'none';
    return;
  }
  filtrati.sort(CRITERI_ORDINAMENTO[criterioOrdinamento]);
  mostrati = 0;
  renderPagina();
  aggiornaUrlFiltri();
}

function renderBannerFiltroFisso() {
  const banner = document.getElementById('bannerFiltroFisso');
  if (telefoniForzati.size === 0) { banner.hidden = true; return; }
  banner.hidden = false;
  const n = telefoniForzati.size;
  banner.innerHTML = `${n === 1 ? '1 annuncio aperto' : `${n} annunci aperti`} dal DB (filtri disattivati) <button type="button" id="btnChiudiFiltroFisso">Torna all'elenco</button>`;
  banner.querySelector('#btnChiudiFiltroFisso').addEventListener('click', () => {
    telefoniForzati.clear();
    applicaFiltri();
    renderBannerFiltroFisso();
  });
}

// Filtri persistenti nell'URL: letti all'avvio invece dei default (vedi avviaApp), riscritti
// con history.replaceState ad ogni cambio filtro — MAI pushState, altrimenti ogni singolo
// toggle di un checkbox intaserebbe il tasto "indietro" del browser. L'ordinamento resta
// invece in localStorage (persiste anche cambiando città, un URL diverso per città non
// avrebbe senso per quella preferenza).
function leggiFiltriDaUrl() {
  const p = new URLSearchParams(location.search);
  let filtroAvanzatoUrl = null;
  try {
    filtroAvanzatoUrl = JSON.parse(p.get('filtroAvanzato') || 'null');
  } catch {
    // parametro corrotto/vecchio formato: si riparte da un filtro avanzato vuoto
  }
  return {
    ricerca: p.get('ricerca') || '',
    parole: (p.get('parole') || '').split(',').map(s => s.trim()).filter(Boolean),
    escludi: (p.get('escludi') || '').split(',').map(s => s.trim()).filter(Boolean),
    servizi: (p.get('servizi') || '').split(',').map(s => s.trim()).filter(Boolean),
    soloNuovi: p.get('nuovi') === '1',
    soloPreferiti: p.get('preferiti') === '1',
    mostraScartati: p.get('scartati') === '1',
    telefoni: (p.get('telefoni') || '').split(',').map(s => s.trim()).filter(Boolean),
    filtroAvanzato: filtroAvanzatoUrl,
  };
}

function aggiornaUrlFiltri() {
  const p = new URLSearchParams();
  p.set('citta', cittaCorrente);
  const testo = document.getElementById('ricerca').value.trim();
  if (testo) p.set('ricerca', testo);
  if (paroleSelezionate.size) p.set('parole', [...paroleSelezionate].join(','));
  if (paroleEscludiSelezionate.size) p.set('escludi', [...paroleEscludiSelezionate].join(','));
  if (serviziSelezionati.size) p.set('servizi', [...serviziSelezionati].join(','));
  if (soloNuovi) p.set('nuovi', '1');
  if (soloPreferiti) p.set('preferiti', '1');
  if (mostraScartati) p.set('scartati', '1');
  if (telefoniForzati.size) p.set('telefoni', [...telefoniForzati].join(','));
  if (filtroAvanzato.condizioni.length) p.set('filtroAvanzato', JSON.stringify(filtroAvanzato));
  history.replaceState(null, '', '?' + p.toString());
}

function renderPagina() {
  const app = document.getElementById('app');
  const btn = document.getElementById('caricaAltri');
  osservatoreVisti.disconnect();
  app.innerHTML = '';

  if (filtrati.length === 0) {
    app.innerHTML = '<div class="vuoto">Nessun annuncio trovato.</div>';
    mostrati = 0;
    aggiornaPaginazione();
    return;
  }

  const prossimi = filtrati.slice(0, LIMIT_PAGINA);
  renderBatch(prossimi);
  mostrati = prossimi.length;
  aggiornaPaginazione();
}

function filtriAttiviNelViewer() {
  return !!document.getElementById('ricerca').value.trim()
    || paroleSelezionate.size > 0 || paroleEscludiSelezionate.size > 0 || serviziSelezionati.size > 0
    || soloNuovi || soloPreferiti || mostraScartati
    || filtroAvanzato.condizioni.length > 0 || telefoniForzati.size > 0;
}

// "Mostrati X di Y": Y e' il totale trovato con i filtri attivi (o l'intero elenco senza
// filtri); il bottone dice quanti ne mostra al prossimo click, sempre su Y.
function aggiornaPaginazione() {
  const totale = filtrati.length;
  const filtri = filtriAttiviNelViewer();
  const contatore = document.getElementById('contatoreRisultati');
  const btn = document.getElementById('caricaAltri');
  if (totale === 0) {
    contatore.textContent = filtri
      ? `Nessun annuncio corrisponde ai filtri attivi (${tuttiAnnunci.length} salvati in totale)`
      : 'Nessun annuncio';
  } else {
    contatore.textContent = `Mostrati ${mostrati} di ${totale} annunci${filtri ? ` con i filtri attivi (${tuttiAnnunci.length} salvati in totale)` : ''}`;
  }
  const rimanenti = totale - mostrati;
  btn.style.display = rimanenti > 0 ? 'block' : 'none';
  btn.textContent = `Mostra altri ${Math.min(LIMIT_PAGINA, rimanenti)} di ${totale}`;
}

function caricaAltri() {
  const prossimi = filtrati.slice(mostrati, mostrati + LIMIT_PAGINA);
  renderBatch(prossimi);
  mostrati += prossimi.length;
  aggiornaPaginazione();
}

document.getElementById('caricaAltri').addEventListener('click', caricaAltri);
document.getElementById('ricerca').addEventListener('input', () => {
  clearTimeout(searchDebounceTimer);

});

document.getElementById('lightboxSucc').addEventListener('click', (e) => { e.stopPropagation(); lightboxSuccessiva(); });

function cittaDisponibili() {
  return Object.keys(CONFIG.cittaDisponibili || {});
}

function mostraSelezioneCitta(messaggio) {
  document.getElementById('vistaAnnunci').hidden = true;
  document.getElementById('sottotitolo').textContent = messaggio || '';
  const citta = cittaDisponibili();
  document.getElementById('listaCitta').innerHTML = citta.length
    ? citta.map(c => `<li><a href="?citta=${encodeURIComponent(c)}">${escapeHtml(nomeCitta(c))}</a></li>`).join('')
    : '<li>Nessuna città configurata (il DB non ha ancora una config: vedi README.md per il setup iniziale).</li>';
  document.getElementById('selezioneCitta').hidden = false;
}

// Cambio città: link a tutte le città configurate, quella corrente in grassetto e senza link.
// Ricarica la pagina con ?citta=... (filtri e selezioni sono per città, ripartono da zero).
function renderCambioCitta() {
  const nav = document.getElementById('cambioCitta');
  const citta = cittaDisponibili();
  if (citta.length < 2) { nav.hidden = true; return; }
  nav.innerHTML = citta.map(c => c === cittaCorrente
    ? `<span class="corrente">${escapeHtml(nomeCitta(c))}</span>`
    : `<a href="?citta=${encodeURIComponent(c)}">${escapeHtml(nomeCitta(c))}</a>`).join(' · ');
  nav.hidden = false;
}

async function avviaApp(citta) {
  cittaCorrente = citta;
  renderCambioCitta();
  await migraLocalStorageSeServe(citta);

  // Fetch SENZA filtro: serve solo per il conteggio totale nel sottotitolo e per l'elenco
  // dei servizi disponibili nel dropdown (derivato da cosa e' effettivamente presente nei
  // dati, non da config) — la lista EFFETTIVAMENTE mostrata viene da applicaFiltri() sotto,
  // che interroga il server con l'albero filtro corrente (core_functions/query-annunci.mjs).
  let annunci;
  try {
    const res = await fetch(`/api/annunci?citta=${encodeURIComponent(citta)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    annunci = await res.json();
    // Fotografia di cosa e' nuovo PRIMA che qualunque render lo marchi visto (vedi nuoviInSessione).
    nuoviInSessione.clear();
    registraNuovi(annunci);
  } catch (err) {
    mostraSelezioneCitta(`Errore nel caricare gli annunci di "${nomeCitta(citta)}" dal server: ${err.message}`);
    return;
  }

  try {
    const res = await fetch(`/api/scraping/ultimo-run?citta=${encodeURIComponent(citta)}`);
    ultimoRunCorrente = res.ok ? await res.json() : null;
  } catch {
    ultimoRunCorrente = null; // non blocca il resto della pagina: il sottotitolo semplicemente non mostra i contatori
  }

  // Filtri letti dall'URL invece dei default: vanno popolati PRIMA di
  // renderFiltroParoleChiave/renderFiltroServizi, che disegnano le checkbox dei dropdown
  // già spuntate in base a questi Set.
  const filtriUrl = leggiFiltriDaUrl();
  document.getElementById('ricerca').value = filtriUrl.ricerca;
  filtriUrl.parole.forEach(v => paroleSelezionate.add(v));
  filtriUrl.escludi.forEach(v => paroleEscludiSelezionate.add(v));
  filtriUrl.servizi.forEach(v => serviziSelezionati.add(v));
  soloNuovi = filtriUrl.soloNuovi;
  soloPreferiti = filtriUrl.soloPreferiti;
  mostraScartati = filtriUrl.mostraScartati;
  filtriUrl.telefoni.forEach(t => telefoniForzati.add(t));
  filtroAvanzato = normalizzaFiltroAvanzato(filtriUrl.filtroAvanzato);
  document.getElementById('filtroNuovi').checked = soloNuovi;
  document.getElementById('filtroPreferiti').checked = soloPreferiti;
  document.getElementById('filtroScartati').checked = mostraScartati;
  document.getElementById('ordinamento').value = criterioOrdinamento;
  renderBannerFiltroFisso();
  renderPannelloFiltroAvanzato();

  document.getElementById('selezioneCitta').hidden = true;
  document.getElementById('vistaAnnunci').hidden = false;
  // Ordine "naturale" per updated decrescente: usato solo da renderSottotitolo per
  // "ultimo aggiornamento" (tuttiAnnunci[0]) — l'ordinamento REALE mostrato nella lista
  // e' quello scelto dall'utente, applicato a "filtrati" dentro applicaFiltri().
  tuttiAnnunci = annunci.sort((a, b) => new Date(b.updated) - new Date(a.updated));
  renderSottotitolo(citta);
  renderFiltroParoleChiave();
  renderFiltroServizi();
  await applicaFiltri();
}

// Stato globale (non per città: lo scraper lavora sempre su una sola città alla volta,
// una alla volta in sequenza — vedi avvia-multi.mjs) letto da /api/scraping/stato — polling leggero, non blocca
// nient'altro nella pagina se il server è momentaneamente irraggiungibile.
// "~3m 20s" / "~45s", arrotondato a 5s (stesso formato del log, vedi core_functions/stima-tempo.mjs).
function formattaResiduo(secondi) {
  const s = Math.max(0, Math.round(secondi / 5) * 5);
  const min = Math.floor(s / 60);
  const sec = s % 60;
  if (min === 0) return `~${sec}s`;
  return sec === 0 ? `~${min}m` : `~${min}m ${sec}s`;
}

async function aggiornaStatoScraping() {
  const el = document.getElementById('statoScraping');
  const testo = document.getElementById('statoScrapingTesto');
  const btn = document.getElementById('btnAvviaScraping');
  try {
    const res = await fetch('/api/scraping/stato');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const stato = await res.json();
    if (stato.inCorso) {
      const citta = nomeCitta(stato.citta) || stato.citta;
      const residuo = Number.isFinite(stato.secondiRimanenti)
        ? `${formattaResiduo(stato.secondiRimanenti)} rimanenti`
        : 'stima non ancora disponibile';
      // fase/faseTotale/fonte presenti solo quando lo scraping è partito da avvia-multi.mjs
      // (bottone qui o cron), non da un lancio manuale a riga di comando — vedi
      // backend/avvia-multi.mjs. Senza l'etichetta di fase, il conto alla rovescia di
      // main-escort.mjs che riparte da un numero più alto subito dopo che quello di main.mjs
      // era sceso a "0 min" sembrerebbe un errore invece che l'inizio della fase 2.
      const etichettaFase = stato.fase && stato.faseTotale
        ? ` — fase ${stato.fase}/${stato.faseTotale} (${stato.fonte === 'escort.it' ? 'escort.it' : 'bakecaincontrii'})`
        : '';
      // nuovi/aggiornati: contatori della fase in corso (scritti dallo scraper ad ogni flush,
      // stessi numeri del log); assenti se lo scraper è una versione precedente.
      const conteggi = Number.isFinite(stato.nuovi) && Number.isFinite(stato.aggiornati)
        ? ` — ${stato.nuovi} nuovi, ${stato.aggiornati} aggiornati finora`
        : '';
      testo.textContent = `Aggiornamento in corso su ${citta}${etichettaFase} (${residuo})${conteggi}`;
      el.className = 'stato-scraping in-corso';
      btn.hidden = true;
    } else {
      testo.textContent = 'Nessun aggiornamento in corso.';
      el.className = 'stato-scraping inattivo';
      btn.hidden = false;
      btn.disabled = false;
      // Sulla pagina di una città specifica il bottone scrapa SOLO quella città (vedi
      // handler sotto); sulla selezione iniziale (cittaCorrente non impostata) scrapa tutte
      // le città — l'etichetta riflette lo scope per non far pensare che sia sempre "tutte".
      btn.textContent = cittaCorrente ? `Avvia scraping (${nomeCitta(cittaCorrente) || cittaCorrente})` : 'Avvia scraping (tutte le città)';
    }
    el.hidden = false;
  } catch {
    el.hidden = true;
  }
}

document.getElementById('btnAvviaScraping').addEventListener('click', async () => {
  const btn = document.getElementById('btnAvviaScraping');
  const etichettaOriginale = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Avvio in corso…';
  try {
    // cittaCorrente e' impostata solo quando si e' sulla pagina di una città specifica (non
    // sulla selezione iniziale): in quel caso il body scrapa solo quella, altrimenti il
    // server usa tutte le città in cittaDisponibili (vedi server.mjs).
    const res = await fetch('/api/scraping/avvia', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cittaCorrente ? { citta: cittaCorrente } : {}),
    });
    const dati = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(dati.errore || `HTTP ${res.status}`);
    await aggiornaStatoScraping();
  } catch (err) {
    alert(`Impossibile avviare lo scraping: ${err.message}`);
    btn.disabled = false;
    btn.textContent = etichettaOriginale;
  }
});

async function main() {
  try {
    const res = await fetch('/api/config');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    CONFIG = await res.json();
  } catch (err) {
    document.getElementById('sottotitolo').textContent =
      `Errore nel caricare la configurazione dal server: ${err.message}. Il server ("node server.mjs") è avviato?`;
    return;
  }

  aggiornaStatoScraping();
  setInterval(aggiornaStatoScraping, 15000);

  const paramCitta = (new URLSearchParams(location.search).get('citta') || '').trim().toLowerCase();
  const citteValide = cittaDisponibili();
  if (citteValide.includes(paramCitta)) {
    avviaApp(paramCitta);
  } else {
    mostraSelezioneCitta();
  }
}

main();
</script>
